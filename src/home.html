
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>

    <h1>HOME</h1>

    <div class="profile">

        <div class="nome">...</div>

    </div>

    <script>

        async function init() {

            const response = await fetch("/login/user")

            if (!response.ok) {
                alert("Usuário não logado")
                window.location.href = "/"
                return
            }

            const data = await response.json()

            document.querySelector(".profile .nome").textContent =
                data.username
        }

        init()

    </script>

</body>

</html>
